[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/ttyUSB0

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    fischer-simon/Esp32Lua@^5.4.7

[env:desktop_linux]
platform = native
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    fischer-simon/Esp32Lua@^5.4.7
build_flags =
    -std=c++17
    -DPLATFORM_LINUX
    -I.pio/libdeps/esp32dev/Esp32Lua/src
    -I.pio/libdeps/esp32dev/Esp32Lua/src/lua
    -Iinclude
    -Iinclude/hal
    -Iinclude/ui
    -Iinclude/scripting
    -lSDL2
build_src_filter =
    +<*>
    +<../.pio/libdeps/esp32dev/Esp32Lua/src/lua/*.c>
    -<../.pio/libdeps/esp32dev/Esp32Lua/src/lua/lua.c>
    -<../.pio/libdeps/esp32dev/Esp32Lua/src/lua/luac.c>
    -<main.cpp>
