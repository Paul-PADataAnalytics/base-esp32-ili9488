[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lovyan03/LovyanGFX@^1.1.16

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=27
    -D TFT_RST=4
    -D TFT_BL=32
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
